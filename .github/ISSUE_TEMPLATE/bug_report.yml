name: 🐛 Bug report
description: Report a reproducible problem
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Backend (apps/server)
        - Frontend (apps/web)
        - Database (packages/database)
        - CI/CD / Infra
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment & logs
      description: Node version, OS, relevant logs or screenshots.
    validations:
      required: false
